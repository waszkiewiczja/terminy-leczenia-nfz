<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wyszukiwarka terminów leczenia NFZ. Sprawdź aktualne terminy wizyt i zabiegów, porównuj placówki oraz czasy oczekiwania w województwach i miastach w całej Polsce."
    />
    <title>Nowe Terminy Leczenia NFZ</title>
    <meta property="og:site_name" content="Terminy Leczenia NFZ" />
    <!-- GitHub Pages SPA – decode redirect from 404.html -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <!-- WebSite schema for Google site name -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Psychoterapia Rumia Marta Dzikiewicz",
        "url": "https://terminy-leczenia-nfz.pl/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
